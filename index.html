<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAT'S CRADLE — VHS STRING INTERFACE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Share Tech Mono', monospace;
    color: #fff;
  }

  #app {
    position: relative;
    width: 100vw; height: 100vh;
    background: #000;
  }

  /* Off-screen video — MediaPipe reads from this */
  #video {
    position: absolute; width: 1px; height: 1px;
    opacity: 0; pointer-events: none;
  }

  /* Three RGB-split canvases stacked */
  .rgb-layer {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
  }
  #canvas-r { z-index: 1; mix-blend-mode: screen; }
  #canvas-g { z-index: 2; mix-blend-mode: screen; }
  #canvas-b { z-index: 3; mix-blend-mode: screen; }

  /* Main overlay: VHS grime + hand tracking */
  #overlay-canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10; pointer-events: none;
  }

  /* CSS tape-warp glitch */
  @keyframes tapeWarp {
    0%,92%,100% { transform: none; }
    93%  { transform: skewX(0.5deg) translateX(-3px); }
    95%  { transform: skewX(-0.4deg) translateX(4px); }
    97%  { transform: skewX(0.2deg) translateX(-2px); }
    99%  { transform: translateX(1px); }
  }
  #app { animation: tapeWarp 5s steps(1) infinite; }

  /* ── HUD elements ── */
  #hud {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 20; pointer-events: none;
  }

  /* REC indicator */
  #rec-badge {
    position: absolute; top: 20px; left: 20px;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; letter-spacing: 0.35em;
    color: rgba(255,255,255,0.75);
    text-shadow: 2px 0 rgba(255,0,0,0.6), -2px 0 rgba(0,0,255,0.6);
  }
  #rec-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #ff1a00;
    box-shadow: 0 0 12px #ff1a00, 0 0 4px #ff1a00;
    animation: recBlink 1.05s ease-in-out infinite;
  }
  @keyframes recBlink {
    0%,44%  { opacity: 1; }
    50%,94% { opacity: 0; }
    100%    { opacity: 1; }
  }

  /* Title */
  #title-hud {
    position: absolute; top: 18px; left: 50%;
    transform: translateX(-50%);
    text-align: center; letter-spacing: 0.3em;
    font-family: 'Orbitron', sans-serif;
  }
  .main-title {
    font-size: clamp(10px, 1.4vw, 17px); font-weight: 900;
    color: rgba(255,255,255,0.82);
    text-shadow: 3px 0 rgba(255,0,0,0.55), -3px 0 rgba(0,0,255,0.55),
                 0 0 20px rgba(255,255,255,0.2);
  }
  .sub-title {
    font-size: clamp(7px, 0.75vw, 9px);
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.5em; margin-top: 3px;
    text-shadow: 2px 0 rgba(255,0,0,0.3), -2px 0 rgba(0,0,255,0.3);
  }

  /* Tape counter */
  #vhs-counter {
    position: absolute; bottom: 22px; right: 22px;
    font-size: 13px; letter-spacing: 0.15em;
    color: rgba(255,255,255,0.5);
    text-shadow: 2px 0 rgba(255,0,0,0.5), -2px 0 rgba(0,0,255,0.5);
  }

  /* Status bar */
  #status-bar {
    position: absolute; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 22px; align-items: center;
  }
  .status-item {
    font-size: 10px; letter-spacing: 0.2em;
    opacity: 0.5; display: flex; align-items: center; gap: 5px;
    text-shadow: 1px 0 rgba(255,0,0,0.4), -1px 0 rgba(0,0,255,0.4);
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 7px #fff;
    animation: sdPulse 2s ease-in-out infinite;
  }
  .status-dot.inactive { background: #2a2a2a; box-shadow: none; animation: none; }
  @keyframes sdPulse {
    0%,100% { opacity:1; } 50% { opacity:0.2; }
  }

  /* Loading screen */
  #loading-screen {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000; z-index: 100;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    transition: opacity 0.9s ease;
  }
  #loading-screen.hidden { opacity: 0; pointer-events: none; }
  .load-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(20px, 4vw, 48px); font-weight: 900;
    letter-spacing: 0.3em; color: #fff;
    text-shadow: 5px 0 rgba(255,0,0,0.7), -5px 0 rgba(0,0,255,0.7),
                 0 0 30px rgba(255,255,255,0.15);
  }
  .load-sub {
    font-size: 11px; letter-spacing: 0.5em;
    color: rgba(255,255,255,0.3);
    text-shadow: 2px 0 rgba(255,0,0,0.4), -2px 0 rgba(0,0,255,0.4);
  }
  .load-bar-wrap {
    width: 280px; height: 2px;
    background: rgba(255,255,255,0.07); overflow: hidden;
  }
  .load-bar {
    height: 100%;
    background: linear-gradient(90deg, transparent, #fff, transparent);
    animation: lscan 1.5s linear infinite;
  }
  @keyframes lscan {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(400%); }
  }
  .load-msg { font-size: 10px; color: rgba(255,255,255,0.28); letter-spacing: 0.25em; }
</style>
</head>
<body>
<div id="app">
  <video id="video" autoplay playsinline muted></video>

  <!-- RGB chromatic-aberration layers -->
  <canvas id="canvas-r" class="rgb-layer"></canvas>
  <canvas id="canvas-g" class="rgb-layer"></canvas>
  <canvas id="canvas-b" class="rgb-layer"></canvas>

  <!-- Overlay: VHS effects + hand tracking -->
  <canvas id="overlay-canvas"></canvas>

  <div id="hud">
    <div id="rec-badge"><div id="rec-dot"></div>REC</div>
    <div id="title-hud">
      <div class="main-title">CAT'S CRADLE</div>
      <div class="sub-title">◀ VHS STRING INTERFACE SP ▶</div>
    </div>
    <div id="vhs-counter">00:00:00:00</div>
    <div id="status-bar">
      <div class="status-item"><div class="status-dot" id="dot-cam"></div><span>SIGNAL</span></div>
      <div class="status-item"><div class="status-dot inactive" id="dot-l"></div><span>L-HAND</span></div>
      <div class="status-item"><div class="status-dot inactive" id="dot-r"></div><span>R-HAND</span></div>
    </div>
  </div>

  <div id="loading-screen">
    <div class="load-title">CAT'S CRADLE</div>
    <div class="load-sub">◀◀ REWINDING TAPE ▶▶</div>
    <div class="load-bar-wrap"><div class="load-bar"></div></div>
    <div class="load-msg" id="load-msg">LOADING MEDIAPIPE MODULES…</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
'use strict';
// ════════════════════════════════════════════════════════
//  CANVAS / DOM REFS
// ════════════════════════════════════════════════════════
const video    = document.getElementById('video');
const loading  = document.getElementById('loading-screen');
const loadMsg  = document.getElementById('load-msg');
const counter  = document.getElementById('vhs-counter');

const canvR = document.getElementById('canvas-r');
const canvG = document.getElementById('canvas-g');
const canvB = document.getElementById('canvas-b');
const ctxR  = canvR.getContext('2d');
const ctxG  = canvG.getContext('2d');
const ctxB  = canvB.getContext('2d');

const overlay = document.getElementById('overlay-canvas');
const ctx     = overlay.getContext('2d');

// Off-screen buffer (mirrored clean video)
const buf    = document.createElement('canvas');
const bufCtx = buf.getContext('2d');

// Noise texture canvas
const noiseC   = document.createElement('canvas');
noiseC.width   = 320;
noiseC.height  = 240;
const noiseCtx = noiseC.getContext('2d');

let W = 0, H = 0;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  [canvR, canvG, canvB, overlay, buf].forEach(c => {
    c.width = W; c.height = H;
  });
}
resize();
window.addEventListener('resize', resize);

// ════════════════════════════════════════════════════════
//  HAND STATE
// ════════════════════════════════════════════════════════
let leftLM = null, rightLM = null;

// ════════════════════════════════════════════════════════
//  VHS STATE
// ════════════════════════════════════════════════════════
const vhs = {
  glitchLines: [],
  nextGlitch:  0,
  trackJitter: 0,
  trackDecay:  0,
  frames:      0,
  startMs:     0,
  caShift:     3,      // chromatic aberration base px
  warpY:       0,      // vertical warp
  warpDecay:   0,
};

// ────────────────────────────────────────────────────────
//  Noise grain (re-randomised per frame)
// ────────────────────────────────────────────────────────
function refreshNoise() {
  const id = noiseCtx.createImageData(noiseC.width, noiseC.height);
  const d  = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = Math.random() * 80 | 0;
    d[i] = d[i+1] = d[i+2] = v;
    d[i+3] = Math.random() * 55 | 0;
  }
  noiseCtx.putImageData(id, 0, 0);
}

// ────────────────────────────────────────────────────────
//  Glitch line spawner
// ────────────────────────────────────────────────────────
function spawnGlitch(now) {
  if (now < vhs.nextGlitch) return;
  vhs.nextGlitch = now + 500 + Math.random() * 2800;

  const count = 1 + Math.floor(Math.random() * 4);
  for (let i = 0; i < count; i++) {
    vhs.glitchLines.push({
      y:     Math.random() * H,
      h:     1 + Math.random() * 7,
      shift: (Math.random() - 0.5) * 40,
      alpha: 0.35 + Math.random() * 0.5,
      life:  0.06 + Math.random() * 0.18,
      born:  now,
    });
  }

  if (Math.random() < 0.4) {
    vhs.trackJitter = (Math.random() - 0.5) * 22;
    vhs.trackDecay  = 0.85;
  }

  // Rare vertical warp
  if (Math.random() < 0.15) {
    vhs.warpY     = (Math.random() - 0.5) * 12;
    vhs.warpDecay = 0.75;
  }
}

// ════════════════════════════════════════════════════════
//  VHS VIDEO LAYER — RGB chromatic aberration split
// ════════════════════════════════════════════════════════
function drawVHSVideo(now) {
  if (video.readyState < 2) return;

  const ca  = vhs.caShift + Math.sin(now * 0.0008) * 1.5 + Math.random() * 0.4;
  const jx  = vhs.trackJitter | 0;
  const jy  = vhs.warpY | 0;

  // 1. Mirror into buffer
  bufCtx.clearRect(0, 0, W, H);
  bufCtx.save();
  bufCtx.translate(W, 0);
  bufCtx.scale(-1, 1);
  bufCtx.drawImage(video, 0, 0, W, H);
  bufCtx.restore();

  // ── RED channel (shift right + slight warp) ──────────
  ctxR.clearRect(0, 0, W, H);
  ctxR.save();
  ctxR.filter = 'saturate(1.5) brightness(0.82) contrast(1.05)';
  ctxR.drawImage(buf, ca + jx, jy, W, H);
  ctxR.restore();
  // Mask to red
  ctxR.save();
  ctxR.globalCompositeOperation = 'multiply';
  ctxR.fillStyle = 'rgb(255,50,50)';
  ctxR.fillRect(0, 0, W, H);
  ctxR.restore();

  // ── GREEN channel (centre, slight desaturation) ──────
  ctxG.clearRect(0, 0, W, H);
  ctxG.save();
  ctxG.filter = 'saturate(0.45) brightness(0.7) contrast(0.95)';
  ctxG.drawImage(buf, jx * 0.25, jy * 0.5, W, H);
  ctxG.restore();
  ctxG.save();
  ctxG.globalCompositeOperation = 'multiply';
  ctxG.fillStyle = 'rgb(80,255,80)';
  ctxG.fillRect(0, 0, W, H);
  ctxG.restore();

  // ── BLUE channel (shift left) ────────────────────────
  ctxB.clearRect(0, 0, W, H);
  ctxB.save();
  ctxB.filter = 'saturate(1.3) brightness(0.8) contrast(1.08)';
  ctxB.drawImage(buf, -ca + jx * 0.5, -jy * 0.3, W, H);
  ctxB.restore();
  ctxB.save();
  ctxB.globalCompositeOperation = 'multiply';
  ctxB.fillStyle = 'rgb(50,80,255)';
  ctxB.fillRect(0, 0, W, H);
  ctxB.restore();

  // Decay jitter
  vhs.trackJitter *= vhs.trackDecay;
  if (Math.abs(vhs.trackJitter) < 0.15) { vhs.trackJitter = 0; vhs.trackDecay = 0; }
  vhs.warpY *= vhs.warpDecay;
  if (Math.abs(vhs.warpY) < 0.1) { vhs.warpY = 0; }
}

// ════════════════════════════════════════════════════════
//  VHS OVERLAY (grime, scanlines, glitch lines, luma)
// ════════════════════════════════════════════════════════
function drawVHSOverlay(now) {
  ctx.clearRect(0, 0, W, H);

  // ── Vignette ──
  const vig = ctx.createRadialGradient(W/2, H/2, H*0.22, W/2, H/2, H*0.82);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(0.7,'rgba(0,0,0,0.25)');
  vig.addColorStop(1, 'rgba(0,0,0,0.78)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  // ── Scanlines ──
  ctx.save();
  for (let y = 0; y < H; y += 3) {
    // Slight brightness variation mimics phosphor row variation
    const d = 0.1 + 0.06 * Math.sin(y * 0.09 + now * 0.0004);
    ctx.fillStyle = `rgba(0,0,0,${d})`;
    ctx.fillRect(0, y, W, 1.5);
  }
  ctx.restore();

  // ── Noise grain ──
  refreshNoise();
  ctx.save();
  ctx.globalAlpha = 0.14;
  ctx.drawImage(noiseC, 0, 0, W, H);
  ctx.restore();

  // ── Glitch lines ──
  vhs.glitchLines = vhs.glitchLines.filter(g => {
    const age  = (now - g.born) / 1000;
    if (age > g.life) return false;
    const fade = 1 - age / g.life;

    ctx.save();
    ctx.globalAlpha = g.alpha * fade;

    // White leading edge
    ctx.fillStyle = `rgba(255,255,255,${0.7 * fade})`;
    ctx.fillRect(0, g.y, W, Math.max(1, g.h * 0.3));

    // Shifted colour band from buffer
    ctx.drawImage(buf, g.shift, g.y, W, g.h, g.shift, g.y, W, g.h);

    // Magenta/cyan tint on the band
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = Math.random() < 0.5 ? 'rgba(255,0,180,0.25)' : 'rgba(0,220,255,0.2)';
    ctx.fillRect(0, g.y, W, g.h);
    ctx.restore();
    return true;
  });

  // ── Horizontal colour bleed streaks ──
  if (Math.random() < 0.05) {
    const by = Math.random() * H;
    const bh = 1 + Math.random() * 4;
    ctx.save();
    ctx.globalAlpha = 0.07 + Math.random() * 0.12;
    const bg = ctx.createLinearGradient(0, 0, W, 0);
    bg.addColorStop(0,    'rgba(255,80,80,0)');
    bg.addColorStop(0.35, 'rgba(255,220,100,0.9)');
    bg.addColorStop(0.65, 'rgba(80,200,255,0.9)');
    bg.addColorStop(1,    'rgba(80,80,255,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, by, W, bh);
    ctx.restore();
  }

  // ── Top tape-edge damage ──
  if (Math.random() < 0.01) {
    ctx.save();
    ctx.globalAlpha = 0.3 + Math.random() * 0.4;
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, 2 + Math.random() * 10);
    ctx.restore();
  }

  // ── Bottom edge crinkle ──
  if (Math.random() < 0.008) {
    ctx.save();
    ctx.globalAlpha = 0.15 + Math.random() * 0.2;
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, H - (2 + Math.random() * 5), W, 3);
    ctx.restore();
  }

  // ── Washed-out warm luma tint (VHS colour fading) ──
  ctx.save();
  ctx.globalAlpha = 0.055;
  ctx.fillStyle   = 'rgba(210,195,155,1)';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  // ── Occasional bright flicker ──
  if (Math.random() < 0.007) {
    ctx.save();
    ctx.globalAlpha = 0.06 + Math.random() * 0.08;
    ctx.fillStyle   = '#fff';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}

// ════════════════════════════════════════════════════════
//  TAPE COUNTER
// ════════════════════════════════════════════════════════
function updateCounter(now) {
  const e  = ((now - vhs.startMs) / 1000) | 0;
  const h  = (e / 3600 | 0).toString().padStart(2, '0');
  const m  = ((e % 3600) / 60 | 0).toString().padStart(2, '0');
  const s  = (e % 60).toString().padStart(2, '0');
  const fr = (vhs.frames % 30).toString().padStart(2, '0');
  counter.textContent = `${h}:${m}:${s}:${fr}`;
}

// ════════════════════════════════════════════════════════
//  HAND / STRING DRAWING
// ════════════════════════════════════════════════════════
const FTIP = [4, 8, 12, 16, 20];
const CRADLE_PAIRS = [
  [4,20],[8,16],[12,12],[16,8],[20,4],
  [4,16],[8,20],[16,4],[20,8],
];
const HAND_CONN = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17],
];

function lm(landmarks, i) {
  const p = landmarks[i];
  return { x: (1 - p.x) * W, y: p.y * H };
}

function dist2(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

function drawGlowDot(x, y, r, fill, glow, blur) {
  ctx.save();
  ctx.shadowColor = glow || fill;
  ctx.shadowBlur  = blur || 14;
  ctx.fillStyle   = fill;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawHandLandmarks(landmarks, color, tipColor) {
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur  = 8;
  ctx.strokeStyle = color;
  ctx.lineWidth   = 1.2;
  ctx.globalAlpha = 0.38;
  for (const [a, b] of HAND_CONN) {
    const pa = lm(landmarks, a), pb = lm(landmarks, b);
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
  }
  ctx.restore();
  for (let i = 0; i < landmarks.length; i++) {
    const p = lm(landmarks, i), isTip = FTIP.includes(i);
    drawGlowDot(p.x, p.y, isTip ? 5 : 2.5, isTip ? tipColor : color, color, isTip ? 22 : 8);
  }
}

function drawCradleStrings(lLM, rLM) {
  const spread = dist2(lm(lLM, 0), lm(rLM, 0));
  const t      = Math.min(spread / (Math.min(W, H) * 0.85), 1);
  const hue    = Math.round(180 + t * 180);
  const thick  = 1 + t * 2.5;

  for (const [li, ri] of CRADLE_PAIRS) {
    const pL = lm(lLM, li), pR = lm(rLM, ri);
    const pts = [];
    for (let k = 0; k <= 12; k++) {
      const s = k / 12;
      pts.push({
        x: pL.x + (pR.x - pL.x) * s,
        y: pL.y + (pR.y - pL.y) * s + Math.sin(s * Math.PI) * (12 + t * 45),
      });
    }
    const grad = ctx.createLinearGradient(pL.x, pL.y, pR.x, pR.y);
    grad.addColorStop(0,   `hsla(${hue},          100%,70%,0.9)`);
    grad.addColorStop(0.5, `hsla(${(hue+60)%360}, 100%,70%,0.9)`);
    grad.addColorStop(1,   `hsla(${(hue+120)%360},100%,70%,0.9)`);
    ctx.save();
    ctx.shadowColor = `hsla(${hue},100%,70%,1)`;
    ctx.shadowBlur  = 10 + t * 18;
    ctx.strokeStyle = grad;
    ctx.lineWidth   = thick;
    ctx.globalAlpha = 0.78;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k].x, pts[k].y);
    ctx.stroke();
    ctx.restore();
  }

  // Palm-to-palm dashed string
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() * 0.004);
  const mlx   = (lm(lLM,0).x + lm(lLM,9).x)  / 2;
  const mly   = (lm(lLM,0).y + lm(lLM,9).y)  / 2;
  const mrx   = (lm(rLM,0).x + lm(rLM,9).x) / 2;
  const mry   = (lm(rLM,0).y + lm(rLM,9).y) / 2;
  ctx.save();
  ctx.shadowColor = 'rgba(255,0,255,0.8)';
  ctx.shadowBlur  = 18 + pulse * 18;
  ctx.strokeStyle = `hsla(${300 + pulse*60},100%,70%,0.28)`;
  ctx.lineWidth   = 0.8 + pulse;
  ctx.setLineDash([5, 8]);
  ctx.beginPath(); ctx.moveTo(mlx, mly); ctx.lineTo(mrx, mry); ctx.stroke();
  ctx.restore();
}

// ════════════════════════════════════════════════════════
//  MAIN RENDER LOOP
// ════════════════════════════════════════════════════════
function render(now) {
  requestAnimationFrame(render);
  vhs.frames++;

  spawnGlitch(now);
  drawVHSVideo(now);
  drawVHSOverlay(now);

  // Hand tracking & strings drawn on top
  if (leftLM && rightLM) drawCradleStrings(leftLM, rightLM);
  if (leftLM)  drawHandLandmarks(leftLM,  '#00f5ff', '#ffffff');
  if (rightLM) drawHandLandmarks(rightLM, '#ff00ff', '#ffffff');

  updateCounter(now);

  document.getElementById('dot-l').className = 'status-dot' + (leftLM  ? '' : ' inactive');
  document.getElementById('dot-r').className = 'status-dot' + (rightLM ? '' : ' inactive');
}

requestAnimationFrame(render);

// ════════════════════════════════════════════════════════
//  MEDIAPIPE HANDS
// ════════════════════════════════════════════════════════
loadMsg.textContent = 'INITIALIZING HAND TRACKING…';

const hands = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});
hands.setOptions({
  maxNumHands:            2,
  modelComplexity:        1,
  minDetectionConfidence: 0.7,
  minTrackingConfidence:  0.6,
});
hands.onResults(results => {
  leftLM = rightLM = null;
  if (!results.multiHandLandmarks) return;
  results.multiHandLandmarks.forEach((lmarks, idx) => {
    const label = results.multiHandedness[idx]?.label;
    if (label === 'Left')  rightLM = lmarks;  // mirrored
    if (label === 'Right') leftLM  = lmarks;
  });
});

// ════════════════════════════════════════════════════════
//  CAMERA
// ════════════════════════════════════════════════════════
loadMsg.textContent = 'REQUESTING CAMERA ACCESS…';

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
      audio: false,
    });
    video.srcObject = stream;
    await new Promise(r => { video.onloadedmetadata = r; });
    await video.play();

    document.getElementById('dot-cam').className = 'status-dot';
    vhs.startMs = performance.now();

    async function processFrame() {
      if (video.readyState >= 2) await hands.send({ image: video });
      requestAnimationFrame(processFrame);
    }
    processFrame();

    loadMsg.textContent = 'TAPE READY — RAISE YOUR HANDS';
    setTimeout(() => loading.classList.add('hidden'), 900);
  } catch (err) {
    loadMsg.textContent = `SIGNAL LOST: ${err.message}`;
  }
}

startCamera();
</script>
</body>
</html>

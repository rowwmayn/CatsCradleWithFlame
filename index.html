<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAT'S CRADLE — Neural String Interface</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cyan: #00f5ff;
    --magenta: #ff00ff;
    --yellow: #ffff00;
    --dark: #020408;
    --panel-bg: rgba(0,20,30,0.85);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--dark);
    overflow: hidden;
    font-family: 'Share Tech Mono', monospace;
    color: var(--cyan);
  }

  #app {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }

  /* Main canvas fills the screen */
  #overlay-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
  }

  /* Hidden video feed for MediaPipe */
  #video {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0;
    transform: scaleX(-1);
    pointer-events: none;
  }

  /* HUD overlay elements */
  #hud {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 20;
    pointer-events: none;
  }

  .corner-bracket {
    position: absolute;
    width: 60px; height: 60px;
    opacity: 0.5;
  }
  .corner-bracket::before,
  .corner-bracket::after {
    content: '';
    position: absolute;
    background: var(--cyan);
  }
  .corner-bracket.tl { top: 16px; left: 16px; }
  .corner-bracket.tl::before { width: 2px; height: 100%; top: 0; left: 0; }
  .corner-bracket.tl::after  { height: 2px; width: 100%; top: 0; left: 0; }
  .corner-bracket.tr { top: 16px; right: 16px; }
  .corner-bracket.tr::before { width: 2px; height: 100%; top: 0; right: 0; }
  .corner-bracket.tr::after  { height: 2px; width: 100%; top: 0; right: 0; }
  .corner-bracket.bl { bottom: 16px; left: 16px; }
  .corner-bracket.bl::before { width: 2px; height: 100%; bottom: 0; left: 0; }
  .corner-bracket.bl::after  { height: 2px; width: 100%; bottom: 0; left: 0; }
  .corner-bracket.br { bottom: 16px; right: 16px; }
  .corner-bracket.br::before { width: 2px; height: 100%; bottom: 0; right: 0; }
  .corner-bracket.br::after  { height: 2px; width: 100%; bottom: 0; right: 0; }

  #title-hud {
    position: absolute;
    top: 20px; left: 50%;
    transform: translateX(-50%);
    text-align: center;
    letter-spacing: 0.3em;
    font-family: 'Orbitron', sans-serif;
  }
  #title-hud .main-title {
    font-size: clamp(10px, 1.5vw, 18px);
    font-weight: 900;
    color: var(--cyan);
    text-shadow: 0 0 20px var(--cyan), 0 0 40px rgba(0,245,255,0.4);
    opacity: 0.8;
  }
  #title-hud .sub {
    font-size: clamp(7px, 0.8vw, 10px);
    color: rgba(0,245,255,0.4);
    letter-spacing: 0.5em;
    margin-top: 2px;
  }

  #status-bar {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 24px;
    align-items: center;
  }
  .status-item {
    font-size: 10px;
    letter-spacing: 0.2em;
    opacity: 0.6;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
    animation: pulse 2s ease-in-out infinite;
  }
  .status-dot.inactive { background: #333; box-shadow: none; animation: none; }
  .status-dot.fire { background: #ff6600; box-shadow: 0 0 8px #ff6600; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  #loading-screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: var(--dark);
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    transition: opacity 0.8s ease;
  }
  #loading-screen.hidden { opacity: 0; pointer-events: none; }

  .load-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(20px, 4vw, 48px);
    font-weight: 900;
    letter-spacing: 0.3em;
    color: var(--cyan);
    text-shadow: 0 0 30px var(--cyan), 0 0 60px rgba(0,245,255,0.3);
  }
  .load-sub {
    font-size: 11px;
    letter-spacing: 0.5em;
    color: rgba(0,245,255,0.5);
  }
  .load-bar-wrap {
    width: 300px;
    height: 2px;
    background: rgba(0,245,255,0.1);
    position: relative;
    overflow: hidden;
  }
  .load-bar {
    height: 100%;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    animation: scan 1.5s linear infinite;
  }
  @keyframes scan {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(300%); }
  }
  .load-msg {
    font-size: 11px;
    color: rgba(0,245,255,0.4);
    letter-spacing: 0.2em;
  }

  /* Fire notification toast */
  #fire-toast {
    position: absolute;
    top: 80px; left: 50%;
    transform: translateX(-50%);
    background: rgba(255,80,0,0.15);
    border: 1px solid rgba(255,80,0,0.4);
    padding: 8px 20px;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: #ff8844;
    text-shadow: 0 0 10px #ff4400;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 30;
  }
  #fire-toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay-canvas"></canvas>

  <div id="hud">
    <div class="corner-bracket tl"></div>
    <div class="corner-bracket tr"></div>
    <div class="corner-bracket bl"></div>
    <div class="corner-bracket br"></div>
    <div id="title-hud">
      <div class="main-title">CAT'S CRADLE</div>
      <div class="sub">NEURAL STRING INTERFACE v2.4</div>
    </div>
    <div id="status-bar">
      <div class="status-item">
        <div class="status-dot" id="dot-cam"></div>
        <span>CAMERA</span>
      </div>
      <div class="status-item">
        <div class="status-dot inactive" id="dot-l"></div>
        <span>LEFT HAND</span>
      </div>
      <div class="status-item">
        <div class="status-dot inactive" id="dot-r"></div>
        <span>RIGHT HAND</span>
      </div>
      <div class="status-item">
        <div class="status-dot inactive fire" id="dot-fire" style="display:none"></div>
        <span id="fire-label" style="display:none">FIRE ACTIVE</span>
      </div>
    </div>
  </div>

  <div id="fire-toast">🔥 SNAP DETECTED — BLOW TO EXTINGUISH</div>

  <div id="loading-screen">
    <div class="load-title">CAT'S CRADLE</div>
    <div class="load-sub">INITIALIZING NEURAL TRACKING SYSTEM</div>
    <div class="load-bar-wrap"><div class="load-bar"></div></div>
    <div class="load-msg" id="load-msg">LOADING MEDIAPIPE MODULES…</div>
  </div>
</div>

<!-- MediaPipe Hands via CDN -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<!-- FaceMesh for mouth/blow detection -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

<script>
// ─────────────────────────────────────────────────────────────
//  GLOBAL STATE
// ─────────────────────────────────────────────────────────────
const canvas  = document.getElementById('overlay-canvas');
const ctx     = canvas.getContext('2d');
const video   = document.getElementById('video');
const loading = document.getElementById('loading-screen');
const loadMsg = document.getElementById('load-msg');

let W, H;
function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Hand landmark data
let handsData   = [];    // raw results from MediaPipe
let leftLM      = null;  // landmark array for left hand  (camera-mirrored label)
let rightLM     = null;

// Face mesh data
let faceLM      = null;

// ─── Snap detection state ───
const SNAP_WINDOW   = 350;  // ms
const SNAP_DIST_TH  = 0.09; // normalized distance

let snapState = {
  // Per hand: track middle-finger-tip distance to thumb-tip over frames
  left:  { prevDist: null, wasClose: false, lastSnap: 0 },
  right: { prevDist: null, wasClose: false, lastSnap: 0 },
};

// ─── Fire state ───
let fires = {
  left:  { active: false, particles: [], startTime: 0 },
  right: { active: false, particles: [], startTime: 0 },
};

// ─── Blow (mouth open) detection ───
let blowState = { open: false, openStart: 0 };
const BLOW_DURATION = 2000; // ms of mouth open to extinguish

// ─── String physics particles (elastic cat's cradle) ───
const NUM_STRING_PARTICLES = 16;
let stringParticles = [];
for (let i = 0; i < NUM_STRING_PARTICLES; i++) {
  stringParticles.push({ x: W/2, y: H/2, vx: 0, vy: 0 });
}

// ─── Glow trail for each fingertip ───
const MAX_TRAIL = 8;
const trails = {};

// ─── Connection pairs (cat's cradle cross-strings) ───
// Fingertip indices: 4=thumb, 8=index, 12=middle, 16=ring, 20=pinky
const FTIP = [4, 8, 12, 16, 20];
// Cat's cradle connections: left[i] → right[j]
const CRADLE_PAIRS = [
  [4, 20], [8, 16], [12, 12], [16, 8], [20, 4],
  [4, 16], [8, 20], [16, 4], [20, 8],
];

// ─────────────────────────────────────────────────────────────
//  UTILITY
// ─────────────────────────────────────────────────────────────
function lm(landmarks, idx) {
  const p = landmarks[idx];
  // mirror X because video is mirrored
  return { x: (1 - p.x) * W, y: p.y * H };
}

function dist2(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function lerpColor(t, c1, c2) {
  const parse = c => [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
  const a = parse(c1), b = parse(c2);
  return `rgb(${Math.round(a[0]+(b[0]-a[0])*t)},${Math.round(a[1]+(b[1]-a[1])*t)},${Math.round(a[2]+(b[2]-a[2])*t)})`;
}

function showFireToast() {
  const t = document.getElementById('fire-toast');
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ─────────────────────────────────────────────────────────────
//  SNAP DETECTION
// ─────────────────────────────────────────────────────────────
function checkSnap(landmarks, side, now) {
  // Middle-finger tip (12) to thumb tip (4) distance
  const thumb  = landmarks[4];
  const middle = landmarks[12];
  const rawDist = Math.hypot(thumb.x - middle.x, thumb.y - middle.y);

  const state = snapState[side];

  // Was close (< threshold), now far → snap!
  if (state.wasClose && rawDist > SNAP_DIST_TH * 1.8 && (now - state.lastSnap) > 600) {
    state.lastSnap = now;
    state.wasClose = false;
    // Trigger fire on thumb of this hand
    triggerFire(side, landmarks);
    return;
  }

  if (rawDist < SNAP_DIST_TH) {
    state.wasClose = true;
  } else if (rawDist > SNAP_DIST_TH * 1.8) {
    state.wasClose = false;
  }

  state.prevDist = rawDist;
}

// ─────────────────────────────────────────────────────────────
//  FIRE SYSTEM
// ─────────────────────────────────────────────────────────────
function triggerFire(side, landmarks) {
  const fire = fires[side];
  if (fire.active) return;
  fire.active    = true;
  fire.startTime = performance.now();
  fire.particles = [];
  showFireToast();
  document.getElementById('dot-fire').style.display = '';
  document.getElementById('fire-label').style.display = '';
}

function extinguishFire(side) {
  fires[side].active    = false;
  fires[side].particles = [];
  // Hide HUD dot if both out
  if (!fires.left.active && !fires.right.active) {
    document.getElementById('dot-fire').style.display = 'none';
    document.getElementById('fire-label').style.display = 'none';
  }
}

function spawnFireParticle(cx, cy) {
  return {
    x: cx + (Math.random()-0.5)*14,
    y: cy,
    vx: (Math.random()-0.5)*1.5,
    vy: -(Math.random()*3 + 2),
    life: 1,
    decay: Math.random()*0.025 + 0.02,
    size: Math.random()*10 + 6,
  };
}

function updateAndDrawFire(side, landmarks) {
  if (!fires[side].active) return;

  const thumbTip = lm(landmarks, 4);
  const fire = fires[side];

  // Spawn new particles
  for (let i = 0; i < 4; i++) {
    fire.particles.push(spawnFireParticle(thumbTip.x, thumbTip.y - 10));
  }

  // Update & draw
  fire.particles = fire.particles.filter(p => p.life > 0);
  for (const p of fire.particles) {
    p.x  += p.vx + Math.sin(performance.now()*0.005 + p.y)*0.5;
    p.y  += p.vy;
    p.vy *= 0.97;
    p.life -= p.decay;

    const t   = 1 - p.life;
    // Color: white → yellow → orange → red → transparent
    let r = 255, g = Math.max(0, 255 - t * 300), b = 0;
    const alpha = p.life * 0.9;

    ctx.save();
    ctx.globalAlpha = alpha;
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
    grad.addColorStop(0, `rgba(${r},${g},${b},1)`);
    grad.addColorStop(0.4, `rgba(255,80,0,0.6)`);
    grad.addColorStop(1, `rgba(255,0,0,0)`);
    ctx.fillStyle = grad;
    ctx.shadowColor = '#ff4400';
    ctx.shadowBlur  = 20;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

// ─────────────────────────────────────────────────────────────
//  BLOW DETECTION (mouth openness via FaceMesh)
// ─────────────────────────────────────────────────────────────
function checkBlow(now) {
  if (!faceLM) return;
  const lms = faceLM;

  // Upper lip: 13, Lower lip: 14 (inner)
  // Using landmarks 13 (upper inner lip) and 14 (lower inner lip)
  // Better: 0 (chin) vs 17? Use 13 & 14 inner mouth
  const upper = lms[13]; // upper inner lip
  const lower = lms[14]; // lower inner lip
  if (!upper || !lower) return;

  const mouthOpen = Math.abs(upper.y - lower.y);

  if (mouthOpen > 0.025) {
    // Mouth open
    if (!blowState.open) {
      blowState.open      = true;
      blowState.openStart = now;
    } else if (now - blowState.openStart >= BLOW_DURATION) {
      // Blow for 2 seconds → extinguish all fires
      if (fires.left.active || fires.right.active) {
        extinguishFire('left');
        extinguishFire('right');
        blowState.open = false;
        blowState.openStart = 0;
      }
    }
  } else {
    blowState.open      = false;
    blowState.openStart = 0;
  }
}

// Draw blow progress ring around mouth
function drawBlowProgress(now) {
  if (!blowState.open || !faceLM) return;
  if (!fires.left.active && !fires.right.active) return;

  const lms = faceLM;
  const nose = lms[1];
  if (!nose) return;

  // Approximate mouth center from face landmarks
  const mx = (1 - nose.x) * W;
  const my = nose.y * H + 60;

  const elapsed  = now - blowState.openStart;
  const progress = Math.min(elapsed / BLOW_DURATION, 1);
  const radius   = 30;

  ctx.save();
  ctx.strokeStyle = '#ff6600';
  ctx.lineWidth   = 3;
  ctx.shadowColor = '#ff4400';
  ctx.shadowBlur  = 15;
  ctx.globalAlpha = 0.8;

  // Background arc
  ctx.beginPath();
  ctx.arc(mx, my, radius, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(255,100,0,0.2)';
  ctx.stroke();

  // Progress arc
  ctx.beginPath();
  ctx.arc(mx, my, radius, -Math.PI/2, -Math.PI/2 + progress * Math.PI*2);
  ctx.strokeStyle = `hsl(${30 - progress*30},100%,60%)`;
  ctx.shadowBlur  = 20;
  ctx.stroke();

  // Label
  ctx.fillStyle   = '#ff8844';
  ctx.font        = '10px "Share Tech Mono"';
  ctx.textAlign   = 'center';
  ctx.fillText('BLOW TO EXTINGUISH', mx, my + radius + 15);
  ctx.restore();
}

// ─────────────────────────────────────────────────────────────
//  STRING PHYSICS (elastic interpolation)
// ─────────────────────────────────────────────────────────────
function updateStrings(pA, pB) {
  const n = NUM_STRING_PARTICLES;
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const tx = pA.x + (pB.x - pA.x) * t;
    const ty = pA.y + (pB.y - pA.y) * t + Math.sin(t * Math.PI) * 30; // droop

    const sp = stringParticles[i];
    // Spring toward target
    sp.vx += (tx - sp.x) * 0.25;
    sp.vy += (ty - sp.y) * 0.25;
    sp.vx *= 0.72;
    sp.vy *= 0.72;
    sp.x  += sp.vx;
    sp.y  += sp.vy;
  }
}

// ─────────────────────────────────────────────────────────────
//  DRAWING HELPERS
// ─────────────────────────────────────────────────────────────
function drawGlowDot(x, y, radius, color, glowColor, glowBlur) {
  ctx.save();
  ctx.shadowColor = glowColor || color;
  ctx.shadowBlur  = glowBlur  || 15;
  ctx.fillStyle   = color;
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawHandLandmarks(landmarks, color, accentColor) {
  // Connections (simplified skeleton)
  const CONNECTIONS = [
    [0,1],[1,2],[2,3],[3,4],
    [0,5],[5,6],[6,7],[7,8],
    [5,9],[9,10],[10,11],[11,12],
    [9,13],[13,14],[14,15],[15,16],
    [13,17],[17,18],[18,19],[19,20],
    [0,17],
  ];

  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur  = 8;
  ctx.strokeStyle = color;
  ctx.lineWidth   = 1.2;
  ctx.globalAlpha = 0.35;
  for (const [a, b] of CONNECTIONS) {
    const pa = lm(landmarks, a), pb = lm(landmarks, b);
    ctx.beginPath();
    ctx.moveTo(pa.x, pa.y);
    ctx.lineTo(pb.x, pb.y);
    ctx.stroke();
  }
  ctx.restore();

  // Joints
  for (let i = 0; i < landmarks.length; i++) {
    const p = lm(landmarks, i);
    const isTip = FTIP.includes(i);
    const r = isTip ? 5 : 3;
    drawGlowDot(p.x, p.y, r, isTip ? accentColor : color, color, isTip ? 20 : 10);
  }
}

function drawCradleStrings(leftLM, rightLM) {
  if (!leftLM || !rightLM) return;

  // Calculate overall spread distance
  const lWrist = lm(leftLM,  0);
  const rWrist = lm(rightLM, 0);
  const spread = dist2(lWrist, rWrist);
  const maxSpread = Math.min(W, H) * 0.9;
  const t = Math.min(spread / maxSpread, 1);

  // Color based on distance: cyan→magenta→yellow
  const stringHue = Math.round(180 + t * 180); // 180 cyan → 300 magenta → (loop)
  const thickness = 1 + t * 2.5;

  for (const [li, ri] of CRADLE_PAIRS) {
    const pL = lm(leftLM,  li);
    const pR = lm(rightLM, ri);

    // Update physics particles for this string
    // (use a quick pass instead of per-string particles for perf)
    const n    = 10;
    const pts  = [];
    for (let k = 0; k <= n; k++) {
      const s    = k / n;
      const droop = Math.sin(s * Math.PI) * (15 + t * 40);
      pts.push({
        x: pL.x + (pR.x - pL.x) * s,
        y: pL.y + (pR.y - pL.y) * s + droop,
      });
    }

    // Gradient stroke
    const grad = ctx.createLinearGradient(pL.x, pL.y, pR.x, pR.y);
    grad.addColorStop(0,   `hsla(${stringHue},     100%,70%,0.9)`);
    grad.addColorStop(0.5, `hsla(${(stringHue+60)%360},100%,70%,0.9)`);
    grad.addColorStop(1,   `hsla(${(stringHue+120)%360},100%,70%,0.9)`);

    ctx.save();
    ctx.shadowColor = `hsla(${stringHue},100%,70%,1)`;
    ctx.shadowBlur  = 12 + t * 20;
    ctx.strokeStyle = grad;
    ctx.lineWidth   = thickness;
    ctx.globalAlpha = 0.75;
    ctx.lineJoin    = 'round';
    ctx.lineCap     = 'round';

    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let k = 1; k < pts.length; k++) {
      ctx.lineTo(pts[k].x, pts[k].y);
    }
    ctx.stroke();
    ctx.restore();
  }

  // Extra: thick pulsing central string between palms
  const midLx = (lm(leftLM, 0).x  + lm(leftLM, 9).x)  / 2;
  const midLy = (lm(leftLM, 0).y  + lm(leftLM, 9).y)  / 2;
  const midRx = (lm(rightLM, 0).x + lm(rightLM, 9).x) / 2;
  const midRy = (lm(rightLM, 0).y + lm(rightLM, 9).y) / 2;

  const pulse = 0.5 + 0.5 * Math.sin(performance.now() * 0.004);
  ctx.save();
  ctx.shadowColor = `rgba(255,0,255,0.8)`;
  ctx.shadowBlur  = 20 + pulse * 20;
  ctx.strokeStyle = `hsla(${300 + pulse*60},100%,70%,0.3)`;
  ctx.lineWidth   = 1 + pulse;
  ctx.setLineDash([6, 8]);
  ctx.beginPath();
  ctx.moveTo(midLx, midLy);
  ctx.lineTo(midRx, midRy);
  ctx.stroke();
  ctx.restore();
}

// ─────────────────────────────────────────────────────────────
//  SCANLINE / VIGNETTE OVERLAY
// ─────────────────────────────────────────────────────────────
let scanlineCanvas, scanCtx;
function buildScanlines() {
  scanlineCanvas = document.createElement('canvas');
  scanlineCanvas.width  = 4;
  scanlineCanvas.height = 4;
  const sc = scanlineCanvas.getContext('2d');
  sc.fillStyle = 'rgba(0,0,0,0.18)';
  sc.fillRect(0, 0, 4, 2);
  sc.fillStyle = 'rgba(0,0,0,0)';
  sc.fillRect(0, 2, 4, 2);
}
buildScanlines();

function drawVignetteAndScanlines() {
  // Vignette
  const vgrad = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.85);
  vgrad.addColorStop(0, 'rgba(0,0,0,0)');
  vgrad.addColorStop(1, 'rgba(0,0,10,0.65)');
  ctx.fillStyle = vgrad;
  ctx.fillRect(0, 0, W, H);

  // Scanlines
  ctx.save();
  ctx.globalAlpha = 0.07;
  const pat = ctx.createPattern(scanlineCanvas, 'repeat');
  ctx.fillStyle   = pat;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

// ─────────────────────────────────────────────────────────────
//  MAIN RENDER LOOP
// ─────────────────────────────────────────────────────────────
function render(now) {
  requestAnimationFrame(render);

  ctx.clearRect(0, 0, W, H);

  // Draw mirrored video
  ctx.save();
  ctx.translate(W, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, W, H);
  ctx.restore();

  // Dark overlay
  ctx.fillStyle = 'rgba(2,4,8,0.45)';
  ctx.fillRect(0, 0, W, H);

  // ── Cat's cradle strings ──
  if (leftLM && rightLM) {
    drawCradleStrings(leftLM, rightLM);
  }

  // ── Hand landmarks ──
  if (leftLM) {
    drawHandLandmarks(leftLM, '#00f5ff', '#ffffff');
    checkSnap(leftLM, 'left', now);
    if (fires.left.active) updateAndDrawFire('left', leftLM);
  }
  if (rightLM) {
    drawHandLandmarks(rightLM, '#ff00ff', '#ffffff');
    checkSnap(rightLM, 'right', now);
    if (fires.right.active) updateAndDrawFire('right', rightLM);
  }

  // ── Blow detection & progress ──
  checkBlow(now);
  drawBlowProgress(now);

  // ── Vignette & scanlines ──
  drawVignetteAndScanlines();

  // ── HUD status dots ──
  document.getElementById('dot-l').className = 'status-dot' + (leftLM  ? '' : ' inactive');
  document.getElementById('dot-r').className = 'status-dot' + (rightLM ? '' : ' inactive');
}

requestAnimationFrame(render);

// ─────────────────────────────────────────────────────────────
//  MEDIAPIPE HANDS SETUP
// ─────────────────────────────────────────────────────────────
loadMsg.textContent = 'INITIALIZING HAND TRACKING…';

const hands = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});
hands.setOptions({
  maxNumHands:          2,
  modelComplexity:      1,
  minDetectionConfidence: 0.7,
  minTrackingConfidence:  0.6,
});
hands.onResults(results => {
  leftLM  = null;
  rightLM = null;

  if (!results.multiHandLandmarks) return;

  results.multiHandLandmarks.forEach((landmarks, idx) => {
    // MediaPipe labels are from the model's perspective (un-mirrored),
    // so "Left" in model = right hand in mirrored view and vice versa
    const label = results.multiHandedness[idx]?.label;
    if (label === 'Left')  rightLM = landmarks;
    if (label === 'Right') leftLM  = landmarks;
  });
});

// ─────────────────────────────────────────────────────────────
//  MEDIAPIPE FACE MESH SETUP (for blow detection)
// ─────────────────────────────────────────────────────────────
loadMsg.textContent = 'INITIALIZING FACE MESH…';

const faceMesh = new FaceMesh({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`
});
faceMesh.setOptions({
  maxNumFaces:            1,
  refineLandmarks:        true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence:  0.5,
});
faceMesh.onResults(results => {
  faceLM = results.multiFaceLandmarks?.[0] || null;
});

// ─────────────────────────────────────────────────────────────
//  CAMERA SETUP — single feed split to both models
// ─────────────────────────────────────────────────────────────
loadMsg.textContent = 'REQUESTING CAMERA ACCESS…';

let frameCount = 0;

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
      audio: false,
    });
    video.srcObject = stream;
    await new Promise(r => { video.onloadedmetadata = r; });
    await video.play();

    document.getElementById('dot-cam').className = 'status-dot';

    // Run both models on the same frame
    async function processFrame() {
      if (video.readyState >= 2) {
        frameCount++;
        await hands.send({ image: video });
        // FaceMesh every other frame (perf)
        if (frameCount % 2 === 0) {
          await faceMesh.send({ image: video });
        }
      }
      requestAnimationFrame(processFrame);
    }
    processFrame();

    loadMsg.textContent = 'SYSTEM ONLINE — RAISE YOUR HANDS';
    setTimeout(() => loading.classList.add('hidden'), 800);

  } catch (err) {
    loadMsg.textContent = `CAMERA ERROR: ${err.message}`;
  }
}

startCamera();
</script>
